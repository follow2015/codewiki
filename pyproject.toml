[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "codewiki"
version = "1.0.0"
description = "配置驱动、可离线交付的代码架构知识图谱与文档生成器"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
# 运行时基线：3.11（tomllib / datetime.UTC 是用到的最低特性，外部评审指出
# 3.14.7 下限会挡住绝大多数用户）。CI 按 3.11–3.14 矩阵验证。
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.13,<3",
    "networkx>=3.7",
]

[project.optional-dependencies]
# TS/Go 解析：核心包与语言包精确锁版本（==），三者作为一组联动升级。
treesitter = [
    "tree-sitter==0.26.0",
    "tree-sitter-typescript==0.23.2",
    "tree-sitter-go==0.25.0",
]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.17"]

[project.scripts]
codewiki = "codewiki.cli:main"

[tool.setuptools.packages.find]
include = ["codewiki*"]

[tool.setuptools.package-data]
# mermaid.min.js 随包分发（README 承诺）；不声明则正式 wheel 缺文件
# （editable 安装能跑掩盖了这一点 —— 外部评审实测面）
codewiki = ["assets/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --tb=short"

[tool.ruff]
src = ["."]
line-length = 110
# fixtures 里是**故意**写歪的样例（重定义、未使用导入、成环 import），
# lint 它们等于要求样例像产品代码一样干净 —— 会把能触发边界的样本 lint 掉。
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
