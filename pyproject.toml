[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "codewiki"
version = "1.0.0"
description = "配置驱动、可离线交付的代码架构知识图谱与文档生成器"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
# 运行时基线（设计文稿 9.1）：只维护一条 Python 基线，下限 3.14.7。
# 本机开发可低于该版本直跑测试（源码布局，无需安装本包），但发布与 CI 以 3.14.7+ 为准。
requires-python = ">=3.14.7"
dependencies = [
    "pydantic>=2.13,<3",
    "networkx>=3.7",
]

[project.optional-dependencies]
# TS/Go 解析：核心包与语言包精确锁版本（==），三者作为一组联动升级。
treesitter = [
    "tree-sitter==0.26.0",
    "tree-sitter-typescript==0.23.2",
    "tree-sitter-go==0.25.0",
]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.17"]

[project.scripts]
codewiki = "codewiki.cli:main"

[tool.setuptools.packages.find]
include = ["codewiki*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --tb=short"

[tool.ruff]
src = ["."]
line-length = 110
# fixtures 里是**故意**写歪的样例（重定义、未使用导入、成环 import），
# lint 它们等于要求样例像产品代码一样干净 —— 会把能触发边界的样本 lint 掉。
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
