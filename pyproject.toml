[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "codewiki"
version = "1.0.1"
description = "配置驱动、可离线交付的代码架构知识图谱与文档生成器"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
# 运行时基线：3.11（tomllib / datetime.UTC 是用到的最低特性，外部评审指出
# 3.14.7 下限会挡住绝大多数用户）。CI 按 3.11 / 3.14 两端验证（见 ci.yml）。
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.13,<3",
    # 下限写 3.6 而不是 3.7：**networkx 3.7 的 Requires-Python 是 >=3.12**，而本包
    # 声明支持 3.11。写 >=3.7 会让 3.11 上永远无解（pip 报 No matching
    # distribution，而不是"装个旧版"）——声明与依赖互相矛盾，CI 的 3.11 腿必然红。
    # 本项目只用 strongly_connected_components / simple_cycles /
    # single_source_shortest_path_length / community，3.6 全都有。
    # pip 会按解释器自己选：3.11 装 3.6，3.12+ 装 3.7。
    "networkx>=3.6",
]

[project.optional-dependencies]
# TS/Go 解析：核心包与语言包精确锁版本（==），三者作为一组联动升级。
treesitter = [
    "tree-sitter==0.26.0",
    "tree-sitter-typescript==0.23.2",
    "tree-sitter-go==0.25.0",
]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.17", "pyyaml>=6"]

[project.scripts]
codewiki = "codewiki.cli:main"

[tool.setuptools.packages.find]
include = ["codewiki*"]
# ⚠️ 必须显式关掉 namespaces（默认是 true）。开启时 find 会把**任何目录**都当
# 候选包，于是同步脚本 clone 出来的 `codewiki-deploy/`（里面有一份剥了注释的
# `codewiki/` 副本）被当成命名空间包，整棵树连同 `scripts/` 一起打进 wheel：
# 实测未关时产物里有 61 个 `codewiki-deploy/...` 条目。而 CI 不构建 wheel，
# 这条路径照不出来。
# 关掉后只认带 `__init__.py` 的真包，`codewiki` 及其子包一个不少（60 个模块）。
namespaces = false

[tool.setuptools.package-data]
# mermaid.min.js 随包分发（README 承诺）；不声明则正式 wheel 缺文件
# （editable 安装能跑掩盖了这一点 —— 外部评审实测面）
# .sha256 也带上：它不是运行时依赖（每次启动算 5MB 哈希太贵），而是"这份资产
# 来自哪个上游版本"的证据，出问题时能对得上 tests/test_offline_asset_hash.py。
codewiki = ["assets/*.js", "assets/*.sha256"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --tb=short"
# README 的承诺与测试用同一套 id 互相指认，配对关系由 scripts/check_guarantees.py
# 双向校验（README 有测试没有 ⇒ 承诺没人验证；测试有 README 没有 ⇒ id 拼错）。
markers = [
    "guarantee(id): 该用例守护 README 里标注 `<!-- guarantee: id -->` 的那条承诺",
    "source_tree: 该用例读取仓库源码布局（AST/源码路径），只对源码树有意义；对构建出的 wheel 跑测试时被 release.yml 的 -m 过滤排除",
]

[tool.ruff]
src = ["."]
line-length = 110
# fixtures 里是**故意**写歪的样例（重定义、未使用导入、成环 import），
# lint 它们等于要求样例像产品代码一样干净 —— 会把能触发边界的样本 lint 掉。
# tests/golden 同理：那是**解析器的输入数据**（黄金样本），不是产品代码。
extend-exclude = ["tests/fixtures", "tests/golden"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TID"]
ignore = ["E501"]

# 显式声明 first-party，不靠 `src = ["."]` 的自动探测：
# 交付仓的代码是剥过注释的，源态绿 ≠ 交付态绿。自动探测在某些目录布局下会把
# `codewiki` 判成第三方，于是 `import pytest` 与 `from codewiki...` 被合并成
# 同一组、要求按字母序重排 —— 源态绿、交付态 I001（实测踩过）。
[tool.ruff.lint.isort]
# `tests` 也必须列进来：它是 conftest / 夹具的来源，测试里大量
# `from tests.conftest import ...`。只声明 codewiki 会把它挤进第三方组，
# 于是同一函数里的 `from tests...` 与 `from codewiki...` 被要求加空行分组 ——
# 主仓源态不报、交付态报（strip 掉分隔注释后两组并拢）。
known-first-party = ["codewiki", "tests"]

# 子进程只有一个入口（codewiki/subproc.py）：shell=False、最小环境、超时即杀
# 这三件事写在调用点上，下一个新增的调用点就会重犯同样的错（历史上正是
# ``python -m`` 继承 cwd 让被分析仓库的 json.py 被执行）。用 lint 把这条约束
# 变成"写的时候就红"，而不是等下一轮评审发现。
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"subprocess".msg = "子进程只能经 codewiki/subproc.py 启动（隔离参数必须只写一处）"

[tool.ruff.lint.per-file-ignores]
"codewiki/subproc.py" = ["TID251"]
# 测试与脚本可以用裸 subprocess：前者要**验证**子进程行为（起一个自造脚本看
# 它是否被执行），后者是压测计时工具。产品代码一律经 codewiki/subproc.py。
"tests/**" = ["TID251"]
"scripts/**" = ["TID251"]
