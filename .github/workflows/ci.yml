name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 只验两端，不铺满：
        #   3.11 = requires-python 的下限 —— 验"我们的承诺能不能兑现"
        #   3.14 = 开发基线
        # 中间的 3.12/3.13 不再单列。语法层面的差异由下面 compileall + ruff 覆盖，
        # 而"依赖在某个解释器上根本装不上"这类问题只会在**两端**暴露（实测：
        # networkx 3.7 要 >=3.12，3.11 上直接无解，3.12/3.13 完全测不出来）。
        #
        # 版本号写前缀 `3.14` 而不是 `3.14.7`：setup-python 做的是前缀匹配，会取
        # 当前最新的 3.14.x（现为 3.14.8）。钉死补丁号换不到可复现性（那要靠 pip
        # 锁），却有真实代价：上游下架该补丁后 CI 直接红在 setup 步；而且恰好会
        # 漏掉"新补丁引入回归"。反例就在眼前 —— networkx 3.7 声明
        # `Requires-Python >=3.12,!=3.14.1`，钉死 3.14.1 就会踩上那个坑。
        python-version: ["3.11", "3.14"]
    steps:
      # ⚠️ action 的 Node 版本由它自己 runs.using 声明，**不是**我们能配的 ——
      # 项目里没有 Node，也没有 setup-node 的用武之地。declares node20 的 action
      # 会被运行器"强制在 node24 上跑"（当前状态），弃用期结束后直接不能跑。
      # 所以唯一的修法是把 action 升到声明 node24 的版本：
      #   checkout       v4 = node20 → v5/v6/v7 = node24
      #   setup-python   v5 = node20 → v6/v7    = node24
      # node24 要求运行器 ≥ v2.328.0（GitHub-hosted 现为 2.338.0）。
      # 取最新大版本而非"刚好消警告"的 v5/v6：那两个也会立刻变成同一条债。
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: 安装
        run: |
          python -m pip install -e .
          python -m pip install ruff

      # pip 默认只打 "Collecting / Downloading" 流水账，想知道"这一轮到底装了
      # 哪些组件、各自什么版本"得自己在日志里刨。而版本恰恰是出问题时要的第一手
      # 信息（比如 3.11 与 3.14 两条腿的 networkx 不是同一个版本）。
      # `--format=freeze` 输出 `pkg==ver`，可直接粘进 issue 或本地复现环境。
      - name: 组件清单（解析后的确切版本）
        run: |
          python -V
          python -m pip list --format=freeze | sort

      - name: Lint（ruff，配置见 pyproject [tool.ruff]）
        run: ruff check codewiki

      - name: 语法检查（compileall）
        run: python -m compileall -q codewiki

      - name: 端到端冒烟（对示例仓库出产物）
        run: |
          mkdir -p /tmp/sample/mypkg
          printf 'X = 1\n' > /tmp/sample/mypkg/mod.py
          printf '[project]\nname = "sample"\n' > /tmp/sample/pyproject.toml
          codewiki analyze --src /tmp/sample --out /tmp/sample-out
          test -f /tmp/sample-out/index.html
          test -f /tmp/sample-out/data/codewiki.json

      - name: 机密扫描
        run: python scripts/scan-secrets.py $(git ls-files)
